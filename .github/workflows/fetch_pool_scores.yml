name: Fetch Pool Scores

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 台灣時間 17:00（UTC+8，weekdays）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run pool scores script
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python fetch_pool_scores.py
          python export_sheets_csv.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history_data.csv pool_scores.json research_theses.json sheet_scores.csv sheet_theses.csv
          git diff --staged --quiet || git commit -m "Update pool scores and sheets CSV"
          git pull --rebase origin main
          git push origin main
