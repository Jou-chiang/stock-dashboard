<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研報與 Thesis 戰情室｜Dashboard D</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e10;--bg2:#131619;--bg3:#1a1e22;--bg4:#212730;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaed;--text2:#8b9099;--text3:#565c66;
  --amber:#f0a03a;--amber2:#7a4e12;
  --green:#3fc97c;--green-bg:rgba(63,201,124,0.08);--green-border:rgba(63,201,124,0.25);
  --red:#f25f5f;--red-bg:rgba(242,95,95,0.08);--red-border:rgba(242,95,95,0.25);
  --blue:#5ba3f5;--blue-bg:rgba(91,163,245,0.08);--blue-border:rgba(91,163,245,0.25);
  --purple:#b072f2;--neon:#00e5ff;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans TC',sans-serif;
  --r:6px;--rl:10px;
}
[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --bg3: #f1f5f9;
  --bg4: #e2e8f0;
  --border: #e2e8f0;
  --border2: #cbd5e1;
  --text: #0f172a;
  --text2: #334155;
  --text3: #64748b;
  --amber: #d97706;
  --amber2: #b45309;
  --green: #16a34a;
  --green-bg: rgba(22,163,74,0.08);
  --green-border: rgba(22,163,74,0.25);
  --red: #dc2626;
  --red-bg: rgba(220,38,38,0.08);
  --red-border: rgba(220,38,38,0.25);
  --blue: #2563eb;
  --blue-bg: rgba(37,99,235,0.08);
  --blue-border: rgba(37,99,235,0.25);
  --purple: #7c3aed;
  --neon: #0284c7;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;transition:background .2s,color .2s;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:999;}
[data-theme="light"] body::before{display:none !important;content:none !important;background:none !important;}
.layout{max-width:1400px;margin:0 auto;padding:0 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.brand-title{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--amber);}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.07em;margin-top:2px;}
.badge{font-family:var(--mono);font-size:10px;background:rgba(240,160,58,.15);border:1px solid rgba(240,160,58,.3);color:var(--amber);padding:3px 8px;border-radius:20px;}
.nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-nav{font-family:var(--mono);font-size:11px;color:var(--text3);text-decoration:none;border:1px solid var(--border2);padding:5px 10px;border-radius:var(--r);transition:all .15s;cursor:pointer;background:transparent;outline:none;}
.btn-nav:hover,.btn-nav.active{border-color:var(--amber);color:var(--amber);background:rgba(240,160,58,.08);}
.btn-nav:focus, .btn-submit:focus, .btn-ai-gen:focus, .btn-action:focus, .btn-cancel:focus {
  outline: none !important;
  box-shadow: none !important;
}

.controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.controls-left{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 14px;width:260px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--amber);}
.stat-pill{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:6px 12px;border-radius:var(--r);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px;transition:transform .2s,border-color .2s;position:relative;}
.card:hover{border-color:var(--border2);transform:translateY(-2px);}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.stock-code{font-family:var(--mono);font-size:13px;color:var(--amber);font-weight:500;}
.stock-name{font-size:18px;font-weight:700;color:var(--text);margin-top:2px;}
.cat-tag{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:4px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);}
.card-actions{display:flex;gap:6px;align-items:center;margin-left:8px;}
.btn-action{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:11px;padding:3px 7px;border-radius:4px;cursor:pointer;transition:all .15s;outline:none;}
.btn-action:hover{border-color:var(--amber);color:var(--amber);}
.btn-action.btn-del:hover{border-color:var(--red);color:var(--red);}

.consensus-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;}
.c-item{font-family:var(--mono);font-size:11px;}
.c-label{color:var(--text3);margin-bottom:2px;}
.c-val{color:var(--text);font-size:13px;font-weight:500;}

.scenario-title{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase;}
.scenario-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.sc-item{padding:10px 12px;border-radius:var(--r);font-size:12px;line-height:1.4;display:flex;gap:8px;align-items:center;transition:all .2s;}
.sc-bull{background:var(--green-bg);border:1px solid var(--green-border);color:var(--text);}
.sc-bull .sc-icon{color:var(--green);font-weight:bold;}
.sc-base{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--text);}
.sc-base .sc-icon{color:var(--blue);font-weight:bold;}
.sc-bear{background:var(--red-bg);border:1px solid var(--red-border);color:var(--text);}
.sc-bear .sc-icon{color:var(--red);font-weight:bold;}

/* Active Scenario Highlight / Light Bulb Effect */
.sc-item.active-scenario-bull {
  background: rgba(63,201,124,0.18) !important;
  border: 2px solid var(--green) !important;
  box-shadow: 0 0 12px rgba(63,201,124,0.25);
}
.sc-item.active-scenario-bear {
  background: rgba(242,95,95,0.18) !important;
  border: 2px solid var(--red) !important;
  box-shadow: 0 0 12px rgba(242,95,95,0.25);
}
.sc-item.active-scenario-base {
  background: rgba(91,163,245,0.18) !important;
  border: 2px solid var(--blue) !important;
}

.catalysts-wrap{margin-bottom:14px;}
.cat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.cat-chip{font-size:11px;padding:3px 8px;background:rgba(240,160,58,.08);border:1px solid rgba(240,160,58,.2);color:var(--amber);border-radius:4px;}

.report-note{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;line-height:1.4;}
.report-note::before{content:'📝 法說/研報註記：';color:var(--text3);font-family:var(--mono);display:block;margin-bottom:2px;}

.loading{text-align:center;padding:80px 20px;color:var(--text3);font-family:var(--mono);font-size:13px;}

/* Modal Form Styles */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:10px;gap:10px;flex-wrap:wrap;}
.modal-title{font-size:16px;font-weight:700;color:var(--amber);font-family:var(--mono);}
.btn-close{background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;}
.btn-close:hover{color:var(--text);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1 / -1;}
.form-label{font-size:11px;font-family:var(--mono);color:var(--text3);}
.form-input,.form-textarea,.form-select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--amber);}
.form-textarea{resize:vertical;min-height:60px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--border);padding-top:14px;flex-wrap:wrap;}
.btn-submit{background:var(--amber);color:#000;border:none;padding:8px 16px;border-radius:var(--r);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;outline:none;}
.btn-cancel{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:8px 16px;border-radius:var(--r);font-family:var(--mono);font-size:12px;cursor:pointer;outline:none;}
.btn-ai-gen{background:linear-gradient(135deg, rgba(240,160,58,0.2), rgba(0,229,255,0.2));border:1px solid var(--amber);color:var(--amber);padding:6px 14px;border-radius:var(--r);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;outline:none;}
.btn-ai-gen:hover{background:rgba(240,160,58,0.3);transform:scale(1.02);}
</style>
</head>
<body>
<div class="layout">
  <div class="topbar">
    <div>
      <div class="brand-title">🏛️ 研報與 Thesis 戰情室</div>
      <div class="brand-sub">DASHBOARD D · 質化投資論述 × 情境分析數據庫</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn-nav" id="btn-theme" onclick="toggleTheme(); this.blur();">☀️ 明亮模式</button>
      <span class="badge">Research Thesis</span>
      <div class="nav-links">
        <a href="index.html" class="btn-nav">儀表板 A</a>
        <a href="dashboard_b.html" class="btn-nav">雷達 B</a>
        <a href="dashboard_c.html" class="btn-nav">大戶 C</a>
        <a href="thesis.html" class="btn-nav active">戰情室 D</a>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-left">
      <input type="text" class="search-input" id="search" placeholder="搜尋股票代號或名稱..." oninput="filterCards()" />
      <div class="stat-pill" id="stat-info">載入資料中...</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-nav" style="border-color:var(--amber);color:var(--amber);background:rgba(240,160,58,.1);font-weight:bold;" onclick="openModal(); this.blur();">+ 新增 Thesis 研報</button>
      <button class="btn-nav" onclick="exportJSON(); this.blur();">📥 匯出 JSON</button>
      <button class="btn-nav" id="btn-refresh" style="color:var(--amber);border-color:var(--amber);background:rgba(240,160,58,.08);" onclick="refreshData(); this.blur();">🔄 重新載入伺服器資料</button>
    </div>
  </div>

  <div id="main-content">
    <div class="loading">載入 research_theses.json 數據庫中...</div>
  </div>
</div>

<!-- Modal Dialog for Adding / Editing Thesis -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="modal-title" id="modal-title">+ 新增 Thesis 研報卡片</div>
        <button type="button" class="btn-ai-gen" onclick="autoGenerateThesisInModal(); this.blur();" title="只產生可編輯的估值假設草稿，不會查詢 AI 或真實研報">產生估值情境草稿</button>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <form id="thesis-form" onsubmit="handleFormSubmit(event)">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">股票代號 * (輸入代號或由選單選擇)</label>
          <input type="text" id="form-code" class="form-input" placeholder="例如: 2330 或 3163" required oninput="onCodeInput(this.value)" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">股票名稱 *</label>
          <input type="text" id="form-name" class="form-input" placeholder="例如: 台積電或佳能" required oninput="onNameInput(this.value)" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">產業標的分類</label>
          <input type="text" id="form-category" class="form-input" placeholder="例如: 晶圓代工龍頭" />
        </div>
        <div class="form-group">
          <label class="form-label">研究判斷傾向（無足夠依據時選未知）</label>
          <select id="form-bias" class="form-input">
            <option value="unknown" selected>⚪ 未知／資料不足（不亮燈）</option>
            <option value="bull">🟢 偏多優勢 (樂觀情境亮燈)</option>
            <option value="base">🔵 中立觀望 (基準情境亮燈)</option>
            <option value="bear">🔴 偏空劣勢 (悲觀情境亮燈)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">2026 EPS 區間下限（需有來源）(元)</label>
          <input type="number" step="0.1" id="form-eps-low" class="form-input" placeholder="例如: 55.0" />
        </div>
        <div class="form-group">
          <label class="form-label">2026 EPS 區間上限（需有來源）(元)</label>
          <input type="number" step="0.1" id="form-eps-high" class="form-input" placeholder="例如: 60.0" />
        </div>
        <div class="form-group full">
          <label class="form-label">EPS 來源網址（有來源且日期確認後，才可標記已核實）</label>
          <input type="url" id="form-eps-source" class="form-input" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label class="form-label">EPS 資料日期</label>
          <input type="date" id="form-eps-date" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">EPS 來源狀態</label>
          <select id="form-eps-status" class="form-input">
            <option value="unverified" selected>待核實</option>
            <option value="verified">已人工核實</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">目標 PE 本益比最低 (倍)</label>
          <input type="number" step="1" id="form-pe-low" class="form-input" placeholder="例如: 20" />
        </div>
        <div class="form-group">
          <label class="form-label">目標 PE 本益比最高 (倍)</label>
          <input type="number" step="1" id="form-pe-high" class="form-input" placeholder="例如: 25" />
        </div>
        <div class="form-group full">
          <label class="form-label">Bull 樂觀情境評估</label>
          <textarea id="form-bull" class="form-textarea" placeholder="樂觀情境論述..."></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">Base 基準情境評估</label>
          <textarea id="form-base" class="form-textarea" placeholder="基準情境論述..."></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">Bear 悲觀情境評估</label>
          <textarea id="form-bear" class="form-textarea" placeholder="悲觀情境論述..."></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">核心營運催化劑 (以逗號分隔)</label>
          <input type="text" id="form-catalysts" class="form-input" placeholder="例如: N2製程量產, CoWoS產能倍增" />
        </div>
        <div class="form-group full">
          <label class="form-label">券商研報（券商,評等,目標價,日期,來源網址,verified；多筆用分號分隔）</label>
          <input type="text" id="form-brokers" class="form-input" placeholder="例如: 券商名稱,買進,1280,2026-10-01,https://...,verified" />
        </div>
        <div class="form-group full">
          <label class="form-label">法說 / 研報重點註記</label>
          <textarea id="form-note" class="form-textarea" placeholder="法說會或最新研報重要記錄..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
        <button type="button" class="btn-ai-gen" style="font-size:11px;" onclick="autoGenerateThesisInModal(); this.blur();">重新產生估值草稿</button>
        <button type="submit" class="btn-submit">儲存卡片</button>
      </div>
    </form>
  </div>
</div>

<script>
const LOCAL_KEY = 'user_research_theses_v2';
let thesisData = {};
let serverData = { theses: {} };
let localOverrides = {};
let deletedCodes = new Set();
let editingCode = null;
let poolScoresMap = {};
let priceInfo = {};

const commonTWStockMap = {
  '佳能':'2374','台積電':'2330','聯電':'2303','鴻海':'2317','廣達':'2382','緯創':'3231',
  '緯穎':'6669','技嘉':'2376','微星':'2377','華碩':'2357','奇鋐':'3017','雙鴻':'3324',
  '世芯':'3661','信驊':'5274','波若威':'3163','台燿':'6274','強茂':'2481','富邦金':'2881',
  '中興電':'1513','康舒':'6282','長榮':'2603','萬海':'2615','長榮航':'2618','京元電':'2449',
  '京元電子':'2449','國巨':'2327','欣興':'3037'
};

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function validPrice(value) {
  const n = Number(value);
  return Number.isFinite(n) && n > 0 ? n : null;
}
function parseDate(value) {
  if (!value) return null;
  const d = new Date(String(value).replace(' ', 'T'));
  return Number.isNaN(d.getTime()) ? null : d;
}
function ageHours(value) {
  const d = parseDate(value);
  return d ? (Date.now() - d.getTime()) / 3600000 : Infinity;
}
function ageDays(value) { return ageHours(value) / 24; }
function dateLabel(value) { return value ? esc(String(value).replace('T',' ')) : '時間未提供'; }
function safeHttpUrl(value) {
  try { const u = new URL(String(value || '')); return ['http:','https:'].includes(u.protocol) ? u.href : ''; }
  catch { return ''; }
}

function initTheme() {
  const theme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtnText(theme);
}
function toggleTheme() {
  const next = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeBtnText(next);
}
function updateThemeBtnText(theme) {
  const btn = document.getElementById('btn-theme');
  if (btn) btn.textContent = theme === 'light' ? '🌙 暗黑模式' : '☀️ 明亮模式';
}

async function fetchJSON(path) {
  const res = await fetch(`${path}?v=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function loadMarketData() {
  poolScoresMap = {};
  priceInfo = {};
  let pricesFile = null, poolFile = null;
  try { pricesFile = await fetchJSON('prices.json'); } catch (e) { console.warn('prices.json 載入失敗', e); }
  try { poolFile = await fetchJSON('pool_scores.json'); } catch (e) { console.warn('pool_scores.json 載入失敗', e); }

  (poolFile?.scores || []).forEach(s => {
    if (!s.code) return;
    const code = String(s.code).trim();
    poolScoresMap[code] = s;
    if (s.name) poolScoresMap[String(s.name)] = s;
  });

  const priceRows = Array.isArray(pricesFile?.prices) ? pricesFile.prices : [];
  priceRows.forEach(row => {
    const code = String(row.id || row.code || '').trim();
    const price = validPrice(row.price);
    if (!code || !price) return;
    const stamp = pricesFile.updated || row.updated_at || null;
    const fresh = ageHours(stamp) >= 0 && ageHours(stamp) <= 24;
    priceInfo[code] = {
      price, fresh, updated: stamp, type: '快照報價',
      source: 'Shioaji / prices.json',
      note: fresh ? '檔案更新時間在 24 小時內；來源未提供逐檔成交時間，不能視為已驗證即時成交價。' : '行情檔案超過 24 小時，僅供參考。'
    };
  });

  Object.entries(poolScoresMap).forEach(([key, s]) => {
    if (!/^\d{4,6}$/.test(key)) return;
    const current = priceInfo[key];
    if (current?.fresh) return;
    const price = validPrice(s.price);
    if (!price) return;
    const stamp = s.updated || poolFile?.updated || null;
    const fresh = ageDays(stamp) >= 0 && ageDays(stamp) <= 5;
    const fallback = { price, fresh, updated: stamp, type: '選股資料價格', source: 'pool_scores.json', note: fresh ? '依選股資料日期作參考，非即時報價。' : '選股資料已超過 5 個日曆日，價格視為過期參考值。' };
    if (!current || (!current.fresh && fresh) || (!current.fresh && !fresh && ageHours(current.updated) < ageHours(stamp))) priceInfo[key] = fallback;
  });
  populateStockDatalist();
}

function populateStockDatalist() {
  let list = document.getElementById('stock-pool-list');
  if (!list) { list = document.createElement('datalist'); list.id = 'stock-pool-list'; document.body.appendChild(list); }
  list.replaceChildren();
  const seen = new Set();
  Object.values(poolScoresMap).forEach(s => {
    const code = String(s.code || '');
    if (!code || seen.has(code) || !s.name) return;
    seen.add(code);
    const option = document.createElement('option');
    option.value = code;
    option.label = `${s.name} (${s.sector || '台股'})`;
    list.appendChild(option);
  });
  Object.entries(commonTWStockMap).forEach(([name, code]) => {
    if (seen.has(code)) return;
    seen.add(code);
    const option = document.createElement('option'); option.value = code; option.label = name; list.appendChild(option);
  });
  document.getElementById('form-code')?.setAttribute('list', 'stock-pool-list');
}

async function loadTheses() {
  try { serverData = await fetchJSON('research_theses.json'); }
  catch (e) { serverData = { theses: {} }; console.warn('research_theses.json 載入失敗', e); }
  if (!serverData.theses || typeof serverData.theses !== 'object') serverData.theses = {};
  localOverrides = {};
  deletedCodes = new Set();

  try {
    const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    if (saved) {
      localOverrides = saved.overrides || {};
      deletedCodes = new Set(saved.deleted_codes || []);
    } else {
      // 舊版 localStorage 可能存了整份合併資料；只自動保留伺服器尚不存在的卡片。
      const legacy = JSON.parse(localStorage.getItem('user_research_theses') || 'null');
      const oldTheses = legacy?.theses || {};
      Object.keys(oldTheses).forEach(code => {
        const oldItem = oldTheses[code];
        if (!serverData.theses[code] || JSON.stringify(oldItem) !== JSON.stringify(serverData.theses[code])) localOverrides[code] = oldItem;
      });
      if (legacy?.deleted_codes) deletedCodes = new Set(legacy.deleted_codes);
      persistLocalState();
    }
  } catch (e) { console.warn('本機研究資料讀取失敗', e); }

  thesisData = { ...serverData.theses, ...localOverrides };
  deletedCodes.forEach(code => delete thesisData[code]);
  rawFullData = { ...serverData, theses: thesisData };
  updateStatus();
  renderCards(thesisData);
}

function persistLocalState() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify({ overrides: localOverrides, deleted_codes: [...deletedCodes] }));
}
function updateStatus(message = '') {
  const count = Object.keys(thesisData).length;
  const serverDate = serverData.last_updated || '日期未提供';
  document.getElementById('stat-info').textContent = message || `伺服器資料：${serverDate}｜${count} 檔；本機變更 ${Object.keys(localOverrides).length} 筆`;
}
function saveLocalData(code) {
  if (code) localOverrides[code] = thesisData[code];
  persistLocalState();
  rawFullData = { ...serverData, theses: thesisData };
  updateStatus('已儲存至本機；尚未更新 GitHub 上的 JSON');
  renderCards(thesisData);
}

  initTheme();
  await Promise.all([loadMarketData(), loadTheses()]);
}
async function refreshData() {
  const btn = document.getElementById('btn-refresh');

function getVerifiedBrokerReports(item) {
  return (item.broker_reports || []).filter(r => {
    return r.verification_status === 'verified' && r.report_date && safeHttpUrl(r.source_url) && validPrice(r.target_price);
  });
}
function getBias(item) {
  const bias = String(item.overall_bias || 'unknown').toLowerCase();
  return ['bull','base','bear'].includes(bias) ? bias : 'unknown';
}
function renderCards(theses) {
  const container = document.getElementById('main-content');
  container.replaceChildren();
  const codes = Object.keys(theses);
  if (!codes.length) {
    const empty = document.createElement('div'); empty.className = 'loading'; empty.textContent = '目前尚未建立任何 Thesis 紀錄'; container.appendChild(empty); return;
  }

  const grid = document.createElement('div'); grid.className = 'grid';
  codes.sort().forEach(code => {
    const item = theses[code] || {};
    const quote = priceInfo[code];
    const priceText = quote?.price ? `參考價 ${quote.price} 元｜${quote.type}｜資料時間 ${quote.updated || '未提供'}${quote.fresh ? '' : '（過期）'}` : '價格未取得';
    const forecast = item.consensus_forecast || {};
    const epsRange = forecast['2026_eps_range'];
    const peRange = forecast['target_pe_range'];
    const goodRange = arr => Array.isArray(arr) && arr.length === 2 && arr.every(v => Number.isFinite(Number(v))) && Number(arr[0]) <= Number(arr[1]);
    const eps = goodRange(epsRange) ? `${epsRange[0]} ~ ${epsRange[1]} 元` : '未提供';
    const pe = goodRange(peRange) ? `${peRange[0]} ~ ${peRange[1]} 倍` : '未提供';
    const forecastVerified = forecast.verification_status === 'verified' && forecast.as_of && (safeHttpUrl(forecast.source_url) || forecast.source);
    let impliedTarget = '';
    if (goodRange(epsRange) && goodRange(peRange) && Number(epsRange[0]) > 0 && Number(peRange[0]) > 0) {
      impliedTarget = `${Math.round(Number(epsRange[0]) * Number(peRange[0]))} ~ ${Math.round(Number(epsRange[1]) * Number(peRange[1]))} 元`;
    }
    const verifiedReports = getVerifiedBrokerReports(item);
    const brokerAvg = verifiedReports.length ? Math.round(verifiedReports.reduce((sum, r) => sum + Number(r.target_price), 0) / verifiedReports.length) : null;
    let upside = '';
    if (quote?.fresh && brokerAvg && quote.price) {
      const pct = Math.round((brokerAvg - quote.price) / quote.price * 100);
      upside = `<span style="color:${pct >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:700;">目標價均值差 ${pct >= 0 ? '+' : ''}${pct}%</span>`;
    }
    const bias = getBias(item);
    const scenario = (key, label, text, cls, icon) => text ? `<div class="sc-item sc-${cls}${bias === key ? ` active-scenario-${cls}` : ''}"><span class="sc-icon">${label}</span><div style="flex:1;white-space:pre-wrap;">${esc(text)}</div>${bias === key ? `<span style="margin-left:auto;">${icon}</span>` : ''}</div>` : '';
    const brokersHtml = (item.broker_reports || []).map(r => {
      const verified = getVerifiedBrokerReports({broker_reports:[r]}).length > 0;
      const url = safeHttpUrl(r.source_url);
      const source = url ? `｜<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">來源</a>` : '';
      return `<div style="font-size:11px;background:var(--bg3);border:1px solid var(--border2);padding:7px 10px;border-radius:var(--r);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><span style="color:var(--amber);">${esc(r.broker || '券商')}（${esc(r.rating || '未提供評等')}）｜${esc(r.report_date || '日期未提供')}${source}</span><span>目標價：${validPrice(r.target_price) || '未提供'} 元｜${verified ? '已標記核實' : '未核實，不計入均值'}</span></div>`;
    }).join('');
    const catalysts = Array.isArray(item.catalysts) ? item.catalysts : [];
    const card = document.createElement('article'); card.className = 'card'; card.dataset.code = code; card.dataset.name = item.stock_name || '';
    card.innerHTML = `
      <div class="card-header"><div style="flex:1;"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span class="stock-code">${esc(code)}</span><span class="stock-name">${esc(item.stock_name || code)}</span></div><div style="margin-top:6px;"><span class="cat-tag">${esc(item.category || '未分類')}</span></div><div style="font-size:11px;color:var(--text2);margin-top:6px;">${esc(priceText)}</div>${quote?.note ? `<div style="font-size:10px;color:var(--text3);margin-top:3px;">${esc(quote.note)}</div>` : ''}</div><div class="card-actions"><button class="btn-action" data-action="edit" data-code="${esc(code)}">編輯</button><button class="btn-action btn-del" data-action="delete" data-code="${esc(code)}">刪除</button></div></div>
      <div class="consensus-box"><div class="c-item"><div class="c-label">2026 EPS 區間${forecastVerified ? '（已標示來源）' : '（來源待核實）'}</div><div class="c-val">${esc(eps)}</div>${forecast.source_url && safeHttpUrl(forecast.source_url) ? `<div style="margin-top:3px;font-size:10px;"><a href="${esc(safeHttpUrl(forecast.source_url))}" target="_blank" rel="noopener noreferrer">來源</a>｜${esc(forecast.as_of || '')}</div>` : ''}</div><div class="c-item"><div class="c-label">估值假設 PE</div><div class="c-val">${esc(pe)}</div></div>${impliedTarget ? `<div class="c-item" style="grid-column:1/-1;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px;"><div class="c-label">情境估值（EPS × PE；非券商目標價）</div><div class="c-val" style="color:var(--amber);">${esc(impliedTarget)} ${upside}</div></div>` : ''}</div>
      <div class="scenario-title">Bull / Base / Bear 情境｜${bias === 'unknown' ? '傾向未知，不亮燈' : ({bull:'偏多',base:'中立',bear:'偏空'}[bias])}</div><div class="scenario-list">${scenario('bull','樂觀',item.thesis_points?.bull,'bull','🔥')}${scenario('base','基準',item.thesis_points?.base,'base','⚖️')}${scenario('bear','悲觀',item.thesis_points?.bear,'bear','⚠️')}${bias === 'unknown' ? '<div style="font-size:11px;color:var(--text3);">未設定明確研究傾向；不會依目標價自動推定多空。</div>' : ''}</div>
      ${catalysts.length ? `<div class="scenario-title">已輸入的催化劑（未自動驗證）</div><div class="catalysts-wrap"><div class="cat-list">${catalysts.map(c => `<span class="cat-chip">${esc(c)}</span>`).join('')}</div></div>` : ''}
      ${brokersHtml ? `<div class="scenario-title">券商目標價與來源狀態</div><div class="catalysts-wrap" style="display:flex;flex-direction:column;gap:6px;">${brokersHtml}</div>` : ''}
      ${item.last_report_note ? `<div class="report-note" style="white-space:pre-wrap;">${esc(item.last_report_note)}</div>` : ''}`;
    grid.appendChild(card);
  });
  container.appendChild(grid);
  filterCards();
}

function filterCards() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  let count = 0;
  document.querySelectorAll('.card').forEach(card => {
    const match = (card.dataset.code || '').toLowerCase().includes(query) || (card.dataset.name || '').toLowerCase().includes(query);
    card.style.display = match ? '' : 'none'; if (match) count++;
  });
  const container = document.getElementById('main-content');
  let box = document.getElementById('no-match-box');
  if (query && count === 0) {
    if (!box) { box = document.createElement('div'); box.id = 'no-match-box'; box.style.cssText = 'text-align:center;padding:36px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);margin-top:20px;'; container.appendChild(box); }
    box.replaceChildren();
    const title = document.createElement('div'); title.style.marginBottom = '8px'; title.textContent = `找不到「${document.getElementById('search').value.trim()}」的 Thesis 卡片`;
    const hint = document.createElement('div'); hint.style.cssText = 'font-size:12px;color:var(--text3);margin-bottom:14px;'; hint.textContent = '可以建立一張空白研究卡，或產生待驗證的估值情境草稿。';
    const manual = document.createElement('button'); manual.className = 'btn-cancel'; manual.textContent = '＋ 手動建立'; manual.onclick = () => openModalWithSearch(document.getElementById('search').value.trim());
    const draft = document.createElement('button'); draft.className = 'btn-submit'; draft.style.marginLeft = '8px'; draft.textContent = '產生估值草稿'; draft.onclick = () => { openModalWithSearch(document.getElementById('search').value.trim()); autoGenerateThesisInModal(); };
    box.append(title, hint, manual, draft); box.style.display = 'block';

}

function onCodeInput(value) {

  else if (commonTWStockMap[key]) { document.getElementById('form-code').value = commonTWStockMap[key]; document.getElementById('form-name').value = key; }
  else { const name = Object.keys(commonTWStockMap).find(k => commonTWStockMap[k] === key); if (name) document.getElementById('form-name').value = name; }
}
function onNameInput(value) {

function autoGenerateThesisInModal() {
  const codeInput = document.getElementById('form-code');
  const nameInput = document.getElementById('form-name');
  let code = codeInput.value.trim().toUpperCase();
  let name = nameInput.value.trim();
  if (!code && commonTWStockMap[name]) code = commonTWStockMap[name];
  if (!code && poolScoresMap[name]) code = String(poolScoresMap[name].code);
  if (code && !name) name = poolScoresMap[code]?.name || Object.keys(commonTWStockMap).find(k => commonTWStockMap[k] === code) || code;
  if (!code && !name) { alert('請先輸入股票代號或名稱'); return; }
  codeInput.value = code; nameInput.value = name || code;
  const matched = poolScoresMap[code] || poolScoresMap[name] || {};
  const sector = matched.sector || '產業待確認';
  let peLow = 16, peHigh = 22;
  if (/金融|保險/.test(sector)) { peLow = 12; peHigh = 16; }
  else if (/半導體|晶圓|IC/.test(sector)) { peLow = 20; peHigh = 26; }
  else if (/光電|零組件/.test(sector)) { peLow = 15; peHigh = 20; }
  else if (/航運|鋼鐵/.test(sector)) { peLow = 8; peHigh = 14; }
  document.getElementById('form-category').value = sector === '產業待確認' ? '' : sector;
  document.getElementById('form-bias').value = 'unknown';
  document.getElementById('form-eps-low').value = '';
  document.getElementById('form-eps-high').value = '';
  document.getElementById('form-pe-low').value = peLow;
  document.getElementById('form-pe-high').value = peHigh;
  document.getElementById('form-bull').value = '假設：營收、毛利率或產品組合優於基準預期。請補入可查證的數據與失效條件。';
  document.getElementById('form-base').value = '假設：營運大致符合公司指引與市場預期。請補入 EPS 來源、年度與主要假設。';
  document.getElementById('form-bear').value = '假設：需求、毛利率或競爭狀況惡化。請補入可驗證的風險指標與失效條件。';
  document.getElementById('form-catalysts').value = '';
  document.getElementById('form-brokers').value = '';
  document.getElementById('form-note').value = '此為程式產生的估值情境草稿，非 AI 生成或已查證研報。EPS、催化劑、券商目標價及來源均需自行核實後填入。';
}

function handleFormSubmit(event) {
  event.preventDefault();
  const code = document.getElementById('form-code').value.trim().toUpperCase();
  const name = document.getElementById('form-name').value.trim() || code;
  if (!/^\d{4,6}[A-Z]?$/.test(code)) { alert('股票代號格式不正確，請輸入 4–6 位數字（或合法代碼）'); return; }
  const readNumber = id => { const value = document.getElementById(id).value.trim(); return value === '' ? null : Number(value); };
  const epsLow = readNumber('form-eps-low'), epsHigh = readNumber('form-eps-high');
  const peLow = readNumber('form-pe-low'), peHigh = readNumber('form-pe-high');
  if ((epsLow !== null && epsHigh !== null && epsLow > epsHigh) || (peLow !== null && peHigh !== null && peLow > peHigh)) { alert('區間下限不可大於上限'); return; }
  const rawBrokers = document.getElementById('form-brokers').value.trim();
  const brokerReports = rawBrokers ? rawBrokers.split(';').map(part => {
    const [broker='', rating='', target='', report_date='', source_url='', status='unverified'] = part.split(/[,，]/).map(s => s.trim());
    return { broker, rating, target_price: validPrice(target), report_date, source_url, verification_status: status.toLowerCase() === 'verified' ? 'verified' : 'unverified' };
  }).filter(r => r.broker || r.target_price) : [];
  const existing = thesisData[code] || {};
  const forecast = { ...(existing.consensus_forecast || {}) };
  forecast['2026_eps_range'] = epsLow !== null && epsHigh !== null ? [epsLow, epsHigh] : [];
  forecast.target_pe_range = peLow !== null && peHigh !== null ? [peLow, peHigh] : [];
  forecast.source_url = document.getElementById('form-eps-source').value.trim();
  forecast.as_of = document.getElementById('form-eps-date').value;
  forecast.verification_status = document.getElementById('form-eps-status').value || 'unverified';
  if (forecast.verification_status === 'verified' && (!forecast.as_of || !safeHttpUrl(forecast.source_url) || epsLow === null || epsHigh === null)) { alert('EPS 標記已核實前，請填入有效來源網址、資料日期及 EPS 區間。'); return; }
  thesisData[code] = {
    ...existing, stock_name: name,
    category: document.getElementById('form-category').value.trim() || '自訂研究',
    overall_bias: document.getElementById('form-bias').value || 'unknown',
    consensus_forecast: forecast,
    thesis_points: { bull: document.getElementById('form-bull').value.trim(), base: document.getElementById('form-base').value.trim(), bear: document.getElementById('form-bear').value.trim() },
    catalysts: document.getElementById('form-catalysts').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
    broker_reports: brokerReports,
    last_report_note: document.getElementById('form-note').value.trim(),
    locally_edited_at: new Date().toISOString()
  };
  deletedCodes.delete(code);
  saveLocalData(code);
  closeModal();
}

function deleteCard(code) {

  rawFullData = { ...serverData, theses: thesisData }; updateStatus('已在本機隱藏此卡片；尚未刪除 GitHub 上的原始 JSON'); renderCards(thesisData);
}
function exportJSON() {
  const output = { ...serverData, theses: { ...thesisData }, last_updated: new Date().toISOString().slice(0,10) };
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = 'research_theses.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

document.getElementById('main-content').addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const code = button.dataset.code;
  if (button.dataset.action === 'edit') editCard(code);
  if (button.dataset.action === 'delete') deleteCard(code);
});

init().catch(error => { console.error(error); updateStatus('載入失敗，請檢查 JSON 與網路連線'); });
</script>
</body>
