<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研報與 Thesis 戰情室｜Dashboard D</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e10;--bg2:#131619;--bg3:#1a1e22;--bg4:#212730;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaed;--text2:#8b9099;--text3:#565c66;
  --amber:#f0a03a;--amber2:#7a4e12;
  --green:#3fc97c;--green-bg:rgba(63,201,124,0.08);--green-border:rgba(63,201,124,0.25);
  --red:#f25f5f;--red-bg:rgba(242,95,95,0.08);--red-border:rgba(242,95,95,0.25);
  --blue:#5ba3f5;--blue-bg:rgba(91,163,245,0.08);--blue-border:rgba(91,163,245,0.25);
  --purple:#b072f2;--neon:#00e5ff;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans TC',sans-serif;
  --r:6px;--rl:10px;
}
[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --bg3: #f1f5f9;
  --bg4: #e2e8f0;
  --border: #e2e8f0;
  --border2: #cbd5e1;
  --text: #0f172a;
  --text2: #334155;
  --text3: #64748b;
  --amber: #d97706;
  --amber2: #b45309;
  --green: #16a34a;
  --green-bg: rgba(22,163,74,0.08);
  --green-border: rgba(22,163,74,0.25);
  --red: #dc2626;
  --red-bg: rgba(220,38,38,0.08);
  --red-border: rgba(220,38,38,0.25);
  --blue: #2563eb;
  --blue-bg: rgba(37,99,235,0.08);
  --blue-border: rgba(37,99,235,0.25);
  --purple: #7c3aed;
  --neon: #0284c7;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;transition:background .2s,color .2s;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:999;}
[data-theme="light"] body::before{display:none !important;content:none !important;background:none !important;}
.layout{max-width:1400px;margin:0 auto;padding:0 20px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.brand-title{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--amber);}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.07em;margin-top:2px;}
.badge{font-family:var(--mono);font-size:10px;background:rgba(240,160,58,.15);border:1px solid rgba(240,160,58,.3);color:var(--amber);padding:3px 8px;border-radius:20px;}
.nav-links{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-nav{font-family:var(--mono);font-size:11px;color:var(--text3);text-decoration:none;border:1px solid var(--border2);padding:5px 10px;border-radius:var(--r);transition:all .15s;cursor:pointer;background:transparent;outline:none;}
.btn-nav:hover,.btn-nav.active{border-color:var(--amber);color:var(--amber);background:rgba(240,160,58,.08);}
.btn-nav:focus, .btn-submit:focus, .btn-ai-gen:focus, .btn-action:focus, .btn-cancel:focus {
  outline: none !important;
  box-shadow: none !important;
}

.controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.controls-left{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.search-input{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 14px;width:260px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--amber);}
.stat-pill{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:6px 12px;border-radius:var(--r);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px;transition:transform .2s,border-color .2s;position:relative;}
.card:hover{border-color:var(--border2);transform:translateY(-2px);}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.stock-code{font-family:var(--mono);font-size:13px;color:var(--amber);font-weight:500;}
.stock-name{font-size:18px;font-weight:700;color:var(--text);margin-top:2px;}
.cat-tag{font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:4px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);}
.card-actions{display:flex;gap:6px;align-items:center;margin-left:8px;}
.btn-action{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);font-size:11px;padding:3px 7px;border-radius:4px;cursor:pointer;transition:all .15s;outline:none;}
.btn-action:hover{border-color:var(--amber);color:var(--amber);}
.btn-action.btn-del:hover{border-color:var(--red);color:var(--red);}

.consensus-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;}
.c-item{font-family:var(--mono);font-size:11px;}
.c-label{color:var(--text3);margin-bottom:2px;}
.c-val{color:var(--text);font-size:13px;font-weight:500;}

.scenario-title{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase;}
.scenario-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.sc-item{padding:10px 12px;border-radius:var(--r);font-size:12px;line-height:1.4;display:flex;gap:8px;align-items:center;transition:all .2s;}
.sc-bull{background:var(--green-bg);border:1px solid var(--green-border);color:var(--text);}
.sc-bull .sc-icon{color:var(--green);font-weight:bold;}
.sc-base{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--text);}
.sc-base .sc-icon{color:var(--blue);font-weight:bold;}
.sc-bear{background:var(--red-bg);border:1px solid var(--red-border);color:var(--text);}
.sc-bear .sc-icon{color:var(--red);font-weight:bold;}

/* Active Scenario Highlight / Light Bulb Effect */
.sc-item.active-scenario-bull {
  background: rgba(63,201,124,0.18) !important;
  border: 2px solid var(--green) !important;
  box-shadow: 0 0 12px rgba(63,201,124,0.25);
}
.sc-item.active-scenario-bear {
  background: rgba(242,95,95,0.18) !important;
  border: 2px solid var(--red) !important;
  box-shadow: 0 0 12px rgba(242,95,95,0.25);
}
.sc-item.active-scenario-base {
  background: rgba(91,163,245,0.18) !important;
  border: 2px solid var(--blue) !important;
}

.catalysts-wrap{margin-bottom:14px;}
.cat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.cat-chip{font-size:11px;padding:3px 8px;background:rgba(240,160,58,.08);border:1px solid rgba(240,160,58,.2);color:var(--amber);border-radius:4px;}

.report-note{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;line-height:1.4;}
.report-note::before{content:'📝 法說/研報註記：';color:var(--text3);font-family:var(--mono);display:block;margin-bottom:2px;}

.loading{text-align:center;padding:80px 20px;color:var(--text3);font-family:var(--mono);font-size:13px;}

/* Modal Form Styles */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:10px;gap:10px;flex-wrap:wrap;}
.modal-title{font-size:16px;font-weight:700;color:var(--amber);font-family:var(--mono);}
.btn-close{background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;}
.btn-close:hover{color:var(--text);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1 / -1;}
.form-label{font-size:11px;font-family:var(--mono);color:var(--text3);}
.form-input,.form-textarea,.form-select{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--amber);}
.form-textarea{resize:vertical;min-height:60px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--border);padding-top:14px;flex-wrap:wrap;}
.btn-submit{background:var(--amber);color:#000;border:none;padding:8px 16px;border-radius:var(--r);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;outline:none;}
.btn-cancel{background:transparent;border:1px solid var(--border2);color:var(--text2);padding:8px 16px;border-radius:var(--r);font-family:var(--mono);font-size:12px;cursor:pointer;outline:none;}
.btn-ai-gen{background:linear-gradient(135deg, rgba(240,160,58,0.2), rgba(0,229,255,0.2));border:1px solid var(--amber);color:var(--amber);padding:6px 14px;border-radius:var(--r);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;outline:none;}
.btn-ai-gen:hover{background:rgba(240,160,58,0.3);transform:scale(1.02);}
</style>
</head>
<body>
<div class="layout">
  <div class="topbar">
    <div>
      <div class="brand-title">🏛️ 研報與 Thesis 戰情室</div>
      <div class="brand-sub">DASHBOARD D · 質化投資論述 × 情境分析數據庫</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn-nav" id="btn-theme" onclick="toggleTheme(); this.blur();">☀️ 明亮模式</button>
      <span class="badge">Research Thesis</span>
      <div class="nav-links">
        <a href="index.html" class="btn-nav">儀表板 A</a>
        <a href="dashboard_b.html" class="btn-nav">雷達 B</a>
        <a href="dashboard_c.html" class="btn-nav">大戶 C</a>
        <a href="thesis.html" class="btn-nav active">戰情室 D</a>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-left">
      <input type="text" class="search-input" id="search" placeholder="搜尋股票代號或名稱..." oninput="filterCards()" />
      <div class="stat-pill" id="stat-info">載入資料中...</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-nav" style="border-color:var(--amber);color:var(--amber);background:rgba(240,160,58,.1);font-weight:bold;" onclick="openModal(); this.blur();">+ 新增 Thesis 研報</button>
      <button class="btn-nav" onclick="exportJSON(); this.blur();">📥 匯出 JSON</button>
      <button class="btn-nav" id="btn-refresh" style="color:var(--amber);border-color:var(--amber);background:rgba(240,160,58,.08);" onclick="refreshData(); this.blur();">🔄 同步最新資料</button>
    </div>
  </div>

  <div id="main-content">
    <div class="loading">載入 research_theses.json 數據庫中...</div>
  </div>
</div>

<!-- Modal Dialog for Adding / Editing Thesis -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="modal-title" id="modal-title">+ 新增 Thesis 研報卡片</div>
        <button type="button" class="btn-ai-gen" onclick="autoGenerateThesisInModal(); this.blur();" title="根據股票代號與產業數據自動帶入全部分析資訊">🤖 一鍵 AI / 自動生成研報</button>
      </div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <form id="thesis-form" onsubmit="handleFormSubmit(event)">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">股票代號 * (輸入代號或由選單選擇)</label>
          <input type="text" id="form-code" class="form-input" placeholder="例如: 2330 或 3163" required oninput="onCodeInput(this.value)" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="form-label">股票名稱 *</label>
          <input type="text" id="form-name" class="form-input" placeholder="例如: 台積電" required />
        </div>
        <div class="form-group">
          <label class="form-label">產業標的分類</label>
          <input type="text" id="form-category" class="form-input" placeholder="例如: 晶圓代工龍頭" />
        </div>
        <div class="form-group">
          <label class="form-label">整體基本面多空傾向 (情境高亮燈)</label>
          <select id="form-bias" class="form-input">
            <option value="bull">🟢 偏多優勢 (樂觀情境亮燈)</option>
            <option value="base">🔵 中立觀望 (基準情境亮燈)</option>
            <option value="bear">🔴 偏空劣勢 (悲觀情境亮燈)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">2026 EPS 最低 (元)</label>
          <input type="number" step="0.1" id="form-eps-low" class="form-input" placeholder="例如: 55.0" />
        </div>
        <div class="form-group">
          <label class="form-label">2026 EPS 最高 (元)</label>
          <input type="number" step="0.1" id="form-eps-high" class="form-input" placeholder="例如: 60.0" />
        </div>
        <div class="form-group">
          <label class="form-label">目標 PE 本益比最低 (倍)</label>
          <input type="number" step="1" id="form-pe-low" class="form-input" placeholder="例如: 20" />
        </div>
        <div class="form-group">
          <label class="form-label">目標 PE 本益比最高 (倍)</label>
          <input type="number" step="1" id="form-pe-high" class="form-input" placeholder="例如: 25" />
        </div>
        <div class="form-group full">
          <label class="form-label">Bull 樂觀情境評估</label>
          <textarea id="form-bull" class="form-textarea" placeholder="樂觀情境論述..."></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">Base 基準情境評估</label>
          <textarea id="form-base" class="form-textarea" placeholder="基準情境論述..."></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">Bear 悲觀情境評估</label>
          <textarea id="form-bear" class="form-textarea" placeholder="悲觀情境論述..."></textarea>
        </div>
        <div class="form-group full">
          <label class="form-label">核心營運催化劑 (以逗號分隔)</label>
          <input type="text" id="form-catalysts" class="form-input" placeholder="例如: N2製程量產, CoWoS產能倍增" />
        </div>
        <div class="form-group full">
          <label class="form-label">券商研報目標價 (格式: 券商,評等,目標價 ; 多筆用分號分隔)</label>
          <input type="text" id="form-brokers" class="form-input" placeholder="例如: 摩根士丹利,買進,1280 ; 高盛,買進,1250" />
        </div>
        <div class="form-group full">
          <label class="form-label">法說 / 研報重點註記</label>
          <textarea id="form-note" class="form-textarea" placeholder="法說會或最新研報重要記錄..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
        <button type="button" class="btn-ai-gen" style="font-size:11px;" onclick="autoGenerateThesisInModal(); this.blur();">⚡ 重新 AI 帶入估算</button>
        <button type="submit" class="btn-submit">儲存卡片</button>
      </div>
    </form>
  </div>
</div>

<script>
let thesisData = {};
let rawFullData = {};
let editingCode = null;
let stockPrices = {};
let poolScoresMap = {};

// Theme Toggle
function initTheme(){
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeBtnText(savedTheme);
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeBtnText(next);
}

function updateThemeBtnText(theme){
  const btn = document.getElementById('btn-theme');
  if(btn){
    btn.textContent = theme === 'light' ? '🌙 暗黑模式' : '☀️ 明亮模式';
  }
}

initTheme();

async function loadStockPrices(){
  try{
    const r = await fetch('pool_scores.json?v=' + Date.now());
    if(r.ok){
      const j = await r.json();
      (j.scores||[]).forEach(s => {
        if(s.code){
          const codeStr = String(s.code);
          stockPrices[codeStr] = s.price;
          poolScoresMap[codeStr] = s;
          if(s.name) poolScoresMap[s.name] = s;
        }
      });
      populateStockDatalist();
    }
  }catch(e){}
}

function populateStockDatalist(){
  let datalist = document.getElementById('stock-pool-list');
  if(!datalist){
    datalist = document.createElement('datalist');
    datalist.id = 'stock-pool-list';
    document.body.appendChild(datalist);
  }
  let optionsHtml = '';
  const seenCodes = new Set();
  Object.values(poolScoresMap).forEach(s => {
    if(s.code && s.name && !seenCodes.has(s.code)){
      seenCodes.add(s.code);
      optionsHtml += `<option value="${s.code}">${s.name} (${s.sector || '台股'}) - $${s.price || ''}</option>`;
    }
  });
  datalist.innerHTML = optionsHtml;
  
  const codeInput = document.getElementById('form-code');
  if(codeInput) codeInput.setAttribute('list', 'stock-pool-list');
}

function onCodeInput(val){
  const code = val.trim().toUpperCase();
  if(poolScoresMap[code]){
    document.getElementById('form-name').value = poolScoresMap[code].name;
  }
}

async function init(){
  await loadStockPrices();

  // 1. 優先從伺服器載入最新 research_theses.json
  let serverData = { theses: {} };
  try{
    const res = await fetch('research_theses.json?v=' + Date.now());
    if(res.ok){
      serverData = await res.json();
    }
  }catch(e){}

  rawFullData = serverData;
  thesisData = serverData.theses || {};

  // 2. 融合 localStorage 中的使用者自訂/新增卡片
  const localSaved = localStorage.getItem('user_research_theses');
  if(localSaved){
    try {
      const parsed = JSON.parse(localSaved);
      const localTheses = parsed.theses || {};
      Object.keys(localTheses).forEach(code => {
        if(!thesisData[code]){
          thesisData[code] = localTheses[code];
        } else {
          const sItem = thesisData[code];
          const lItem = localTheses[code];
          thesisData[code] = {
            ...lItem,
            ...sItem,
            broker_reports: (sItem.broker_reports && sItem.broker_reports.length) ? sItem.broker_reports : (lItem.broker_reports || []),
            consensus_forecast: sItem.consensus_forecast || lItem.consensus_forecast,
            thesis_points: sItem.thesis_points || lItem.thesis_points
          };
        }
      });
    } catch(e){}
  }

  const updatedDate = serverData.last_updated || new Date().toISOString().split('T')[0];
  document.getElementById('stat-info').textContent = `最後更新: ${updatedDate} ｜ 共 ${Object.keys(thesisData).length} 檔標的`;
  renderCards(thesisData);
}

function saveLocalData(){
  rawFullData.theses = thesisData;
  rawFullData.last_updated = new Date().toISOString().split('T')[0];
  localStorage.setItem('user_research_theses', JSON.stringify(rawFullData));
  document.getElementById('stat-info').textContent = `最後更新: ${rawFullData.last_updated} ｜ 共 ${Object.keys(thesisData).length} 檔標的`;
  renderCards(thesisData);
}

async function refreshData(){
  const btn = document.getElementById('btn-refresh');
  if(btn){
    btn.blur();
    btn.textContent = '🔄 同步中...';
  }
  const statBtn = document.getElementById('stat-info');
  if(statBtn) statBtn.textContent = '🔄 正在從伺服器同步最新研報與價格數據...';
  
  const localSaved = localStorage.getItem('user_research_theses');
  if(localSaved){
    try {
      const parsed = JSON.parse(localSaved);
      const res = await fetch('research_theses.json?v=' + Date.now());
      if(res.ok){
        const sData = await res.json();
        const sCodes = new Set(Object.keys(sData.theses || {}));
        let cleanTheses = {};
        Object.keys(parsed.theses || {}).forEach(code => {
          if(!sCodes.has(code)){
            cleanTheses[code] = parsed.theses[code];
          }
        });
        parsed.theses = cleanTheses;
        localStorage.setItem('user_research_theses', JSON.stringify(parsed));
      }
    } catch(e){}
  }
  
  window.location.reload();
}

function renderCards(theses){
  const container = document.getElementById('main-content');
  const codes = Object.keys(theses);
  if(!codes.length){
    container.innerHTML = '<div class="loading">目前尚未建立任何 Thesis 紀錄</div>';
    return;
  }

  let html = '<div class="grid">';
  codes.forEach(code => {
    const item = theses[code];
    const curPrice = stockPrices[code];
    const curPriceHtml = curPrice ? `<span style="font-family:var(--mono);font-size:14px;font-weight:700;color:var(--amber);margin-left:auto;">現價 ${curPrice} 元</span>` : '';

    const forecast = item.consensus_forecast || {};
    const epsRange = forecast['2026_eps_range'];
    const peRange = forecast['target_pe_range'];

    const eps = (epsRange && epsRange.length === 2) ? `${epsRange[0]} ~ ${epsRange[1]} 元` : '未提供';
    const pe = (peRange && peRange.length === 2) ? `${peRange[0]} ~ ${peRange[1]} 倍` : '未提供';

    let impliedTarget = '';
    let impliedMin = 0, impliedMax = 0;
    if(epsRange && epsRange.length === 2 && peRange && peRange.length === 2){
      impliedMin = Math.round(epsRange[0] * peRange[0]);
      impliedMax = Math.round(epsRange[1] * peRange[1]);
      impliedTarget = `${impliedMin} ~ ${impliedMax} 元`;
    }

    // 券商平均目標價計算
    let brokerAvg = 0;
    let bTargets = [];
    if(item.broker_reports && item.broker_reports.length){
      bTargets = item.broker_reports.map(r => r.target_price).filter(Boolean);
      if(bTargets.length){
        brokerAvg = Math.round(bTargets.reduce((a,b)=>a+b, 0) / bTargets.length);
      }
    }

    // 漲幅潛力計算 (與現價比較)
    let upsideHtml = '';
    if(curPrice && brokerAvg){
      const upsidePct = Math.round(((brokerAvg - curPrice) / curPrice) * 100);
      const color = upsidePct >= 0 ? 'var(--green)' : 'var(--red)';
      upsideHtml = `<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:rgba(${upsidePct>=0?'63,201,124':'242,95,95'},0.15);color:${color};font-weight:700;">溢價 ${upsidePct>=0?'+':''}${upsidePct}%</span>`;
    }

    // 多空偏向評級 (樂觀/悲觀亮燈)
    let bias = item.overall_bias || '';
    if(!bias){
      if(curPrice && brokerAvg && brokerAvg >= curPrice * 1.08){
        bias = 'bull';
      } else if(curPrice && brokerAvg && brokerAvg < curPrice * 0.95){
        bias = 'bear';
      } else {
        bias = 'bull';
      }
    }

    // 情境亮燈與純圖示套用 (無多餘文字)
    let bullClass = 'sc-item sc-bull' + (bias === 'bull' ? ' active-scenario-bull' : '');
    let baseClass = 'sc-item sc-base' + (bias === 'base' ? ' active-scenario-base' : '');
    let bearClass = 'sc-item sc-bear' + (bias === 'bear' ? ' active-scenario-bear' : '');

    let bullIcon = bias === 'bull' ? '<span style="font-size:14px;margin-left:auto;">🔥</span>' : '';
    let baseIcon = bias === 'base' ? '<span style="font-size:14px;margin-left:auto;">⚖️</span>' : '';
    let bearIcon = bias === 'bear' ? '<span style="font-size:14px;margin-left:auto;">⚠️</span>' : '';

    const points = item.thesis_points || {};
    const catalysts = item.catalysts || [];

    html += `
      <div class="card" data-code="${code}" data-name="${item.stock_name}">
        <div class="card-header">
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="stock-code">${code}</span>
              <span class="stock-name">${item.stock_name}</span>
              ${curPriceHtml}
            </div>
            <div style="margin-top:4px;"><span class="cat-tag">${item.category || '未分類'}</span></div>
          </div>
          <div class="card-actions">
            <button class="btn-action btn-del" onclick="deleteCard('${code}'); this.blur();" title="刪除">🗑️ 刪除</button>
          </div>
        </div>

        <div class="consensus-box">
          <div class="c-item">
            <div class="c-label">2026 EPS 共識區間</div>
            <div class="c-val">${eps}</div>
          </div>
          <div class="c-item">
            <div class="c-label">目標 PE 本益比區間</div>
            <div class="c-val">${pe}</div>
          </div>
          ${impliedTarget ? `
          <div class="c-item" style="grid-column:1 / -1;border-top:1px dashed var(--border);padding-top:8px;margin-top:4px;display:flex;justify-content:space-between;align-items:center;">
            <div class="c-label" style="margin:0;">🤖 演算法估價 (EPS × PE)</div>
            <div class="c-val" style="color:var(--amber);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;">
              ≈ ${impliedTarget} ${upsideHtml}
            </div>
          </div>` : ''}
        </div>

        <div class="scenario-title">Bull / Base / Bear 三情境評估</div>
        <div class="scenario-list">
          ${points.bull ? `<div class="${bullClass}"><span class="sc-icon" style="font-weight:bold;color:var(--green);">樂觀</span><div style="flex:1;">${points.bull}</div>${bullIcon}</div>` : ''}
          ${points.base ? `<div class="${baseClass}"><span class="sc-icon" style="font-weight:bold;color:var(--blue);">基準</span><div style="flex:1;">${points.base}</div>${baseIcon}</div>` : ''}
          ${points.bear ? `<div class="${bearClass}"><span class="sc-icon" style="font-weight:bold;color:var(--red);">悲觀</span><div style="flex:1;">${points.bear}</div>${bearIcon}</div>` : ''}
        </div>

        ${catalysts.length ? `
          <div class="scenario-title">核心營運催化劑</div>
          <div class="catalysts-wrap">
            <div class="cat-list">
              ${catalysts.map(c => `<span class="cat-chip">🚀 ${c}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        ${item.broker_reports && item.broker_reports.length ? `
          <div class="scenario-title">🏛️ 外資與投信研報目標價</div>
          <div class="catalysts-wrap" style="margin-bottom:14px;">
            <div style="display:flex;flex-direction:column;gap:6px;">
              ${item.broker_reports.map(r => `
                <div style="font-family:var(--mono);font-size:11px;background:var(--bg3);border:1px solid var(--border2);padding:6px 10px;border-radius:var(--r);display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:var(--amber);font-weight:500;">${r.broker || '券商'} (${r.rating || '中立'})</span>
                  <span style="color:var(--text);font-weight:700;">目標價: ${r.target_price ? r.target_price + ' 元' : '未提供'}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${item.last_report_note ? `<div class="report-note">${item.last_report_note}</div>` : ''}
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;
}

function filterCards(){
  const query = document.getElementById('search').value.trim().toLowerCase();
  const cards = document.querySelectorAll('.card');
  let matchCount = 0;

  cards.forEach(card => {
    const code = (card.getAttribute('data-code') || '').toLowerCase();
    const name = (card.getAttribute('data-name') || '').toLowerCase();
    if(code.includes(query) || name.includes(query)){
      card.style.display = '';
      matchCount++;
    }else{
      card.style.display = 'none';
    }
  });

  let noMatchEl = document.getElementById('no-match-box');
  if(matchCount === 0 && query){
    if(!noMatchEl){
      noMatchEl = document.createElement('div');
      noMatchEl.id = 'no-match-box';
      noMatchEl.style.cssText = 'text-align:center;padding:50px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);margin-top:20px;';
      document.getElementById('main-content').appendChild(noMatchEl);
    }
    const qStr = document.getElementById('search').value.trim();
    noMatchEl.innerHTML = `
      <div style="font-size:32px;margin-bottom:10px;">🔍</div>
      <div style="font-size:15px;color:var(--text);font-weight:500;margin-bottom:6px;">找不到「<span style="color:var(--amber);">${qStr}</span>」的 Thesis 分析卡片</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:16px;">您可以一鍵讓 AI 自動產生基本面估算與研報卡片，或手動建立</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn-submit" style="background:var(--amber);color:#000;font-weight:bold;padding:10px 20px;" onclick="openModalWithAutoGenerate('${qStr}'); this.blur();">🤖 一鍵 AI 自動生成 ${qStr} 研報卡片</button>
        <button class="btn-cancel" style="padding:10px 16px;" onclick="openModalWithSearch('${qStr}'); this.blur();">＋ 手動建立分析卡片</button>
      </div>
    `;
    noMatchEl.style.display = 'block';
  } else if(noMatchEl) {
    noMatchEl.style.display = 'none';
  }
}

function openModalWithSearch(qStr){
  openModal();
  const numMatch = qStr.match(/\d{4,6}/);
  if(numMatch){
    document.getElementById('form-code').value = numMatch[0];
    const restName = qStr.replace(numMatch[0], '').trim();
    if(restName) document.getElementById('form-name').value = restName;
    else if(poolScoresMap[numMatch[0]]) document.getElementById('form-name').value = poolScoresMap[numMatch[0]].name;
  } else {
    document.getElementById('form-name').value = qStr;
    if(poolScoresMap[qStr]) document.getElementById('form-code').value = poolScoresMap[qStr].code;
  }
}

function openModalWithAutoGenerate(qStr){
  openModalWithSearch(qStr);
  autoGenerateThesisInModal();
  const fakeEvent = { preventDefault: () => {} };
  handleFormSubmit(fakeEvent);
  document.getElementById('search').value = '';
  filterCards();
}

function autoGenerateThesisInModal(){
  let codeInput = document.getElementById('form-code');
  let nameInput = document.getElementById('form-name');
  let code = codeInput.value.trim().toUpperCase();
  let name = nameInput.value.trim();

  let matched = poolScoresMap[code] || poolScoresMap[name];

  if(!code && !name){
    alert('請先輸入或選擇股票代號（例如：2330 或 3163）');
    return;
  }

  if(matched){
    code = String(matched.code);
    name = matched.name;
    codeInput.value = code;
    nameInput.value = name;
  } else if(!name){
    name = code;
    nameInput.value = name;
  }

  const price = matched ? matched.price : 0;
  const sector = (matched && matched.sector) ? matched.sector : '電子零組件';
  const score = matched ? (matched.score || 3) : 3;

  let peLow = 16, peHigh = 22;
  if(sector.includes('金融') || sector.includes('保險')){
    peLow = 12; peHigh = 16;
  } else if(sector.includes('半導體') || sector.includes('晶圓') || sector.includes('IC')){
    peLow = 20; peHigh = 26;
  } else if(sector.includes('電腦') || sector.includes('伺服器') || sector.includes('電子') || sector.includes('網通') || sector.includes('通信')){
    peLow = 16; peHigh = 22;
  } else if(sector.includes('光電') || sector.includes('零組件')){
    peLow = 15; peHigh = 20;
  } else if(sector.includes('航運') || sector.includes('鋼鐵')){
    peLow = 8; peHigh = 14;
  }

  let epsLow = 3.5, epsHigh = 5.0;
  if(price > 0){
    epsLow = Math.round((price / peHigh) * 10) / 10;
    epsHigh = Math.round((price / peLow * 1.12) * 10) / 10;
    if(epsLow <= 0) epsLow = 1.0;
    if(epsHigh <= epsLow) epsHigh = Math.round((epsLow * 1.25) * 10) / 10;
  }

  const bullTarget = Math.round(epsHigh * peHigh);
  const baseTarget = Math.round(((epsLow + epsHigh) / 2) * ((peLow + peHigh) / 2));
  const bearTarget = Math.round(epsLow * peLow);

  document.getElementById('form-category').value = `${sector} 供應鏈`;
  document.getElementById('form-bias').value = 'bull';
  document.getElementById('form-eps-low').value = epsLow;
  document.getElementById('form-eps-high').value = epsHigh;
  document.getElementById('form-pe-low').value = peLow;
  document.getElementById('form-pe-high').value = peHigh;

  document.getElementById('form-bull').value = `🐂 樂觀情境：${name}(${code}) 受益於 ${sector} 需求擴增與新產能放量，高毛利產品比重提升，預估 2026 年 EPS 可達 ${epsHigh} 元，目標價上看 ${bullTarget} 元。`;
  document.getElementById('form-base').value = `⚖️ 基準情境：主營業務需求穩健，產能利用率維持高檔，客戶訂單節奏符合預期，預估 2026 年 EPS 落在 ${epsLow} ~ ${epsHigh} 元區間，估算合理目標價約 ${baseTarget} 元。`;
  document.getElementById('form-bear').value = `🐻 悲觀情境：產業終端庫存去化延後或降價競爭，毛利率受侵蝕，獲利探底至 EPS ${epsLow} 元，目標價下修至 ${bearTarget} 元。`;

  let catList = [`${sector}規格升級`, '新產能擴充放量', '法人籌碼持續集中', '法說會展望樂觀'];
  if(sector.includes('半導體') || sector.includes('晶圓')) catList = ['AI/高階製程需求', '先進封裝產能放量', '外資投信聯手加碼', '單月營收創歷史新高'];
  else if(sector.includes('金融')) catList = ['降息循環利差回升', '股利發放率優異', '資產品質穩健', '法人長線買超'];
  else if(sector.includes('通信') || sector.includes('網通')) catList = ['800G / 光通訊升級波段', '美系大廠直接下單', '大戶持股比例創新高', '毛利率明顯上升'];
  document.getElementById('form-catalysts').value = catList.join(', ');

  const b1Price = Math.round(bullTarget * 0.96);
  const b2Price = Math.round(baseTarget * 1.03);
  document.getElementById('form-brokers').value = `美系外資,買進,${b1Price} ; 國內大型金控投顧,增加持股,${b2Price}`;

  const currentPriceText = price ? `當前股價約 ${price} 元，` : '';
  document.getElementById('form-note').value = `${currentPriceText}根據 ${sector} 產業最新展望與籌碼指標（綜合評分 ${score}/5），基本面與技術面均維持良好走勢，主力與外資法人持股穩定，建議逢拉回分批佈局。`;
}

// Modal Form & Operations
function openModal(code = null){
  editingCode = code;
  const overlay = document.getElementById('modal-overlay');
  const title = document.getElementById('modal-title');
  const form = document.getElementById('thesis-form');
  form.reset();

  if(code && thesisData[code]){
    title.textContent = `✏️ 編輯 ${code} ${thesisData[code].stock_name} Thesis`;
    const item = thesisData[code];
    document.getElementById('form-code').value = code;
    document.getElementById('form-code').readOnly = true;
    document.getElementById('form-name').value = item.stock_name || '';
    document.getElementById('form-category').value = item.category || '';
    document.getElementById('form-bias').value = item.overall_bias || 'bull';
    
    const fc = item.consensus_forecast || {};
    if(fc['2026_eps_range']){
      document.getElementById('form-eps-low').value = fc['2026_eps_range'][0] || '';
      document.getElementById('form-eps-high').value = fc['2026_eps_range'][1] || '';
    }
    if(fc['target_pe_range']){
      document.getElementById('form-pe-low').value = fc['target_pe_range'][0] || '';
      document.getElementById('form-pe-high').value = fc['target_pe_range'][1] || '';
    }

    const pts = item.thesis_points || {};
    document.getElementById('form-bull').value = pts.bull || '';
    document.getElementById('form-base').value = pts.base || '';
    document.getElementById('form-bear').value = pts.bear || '';
    document.getElementById('form-catalysts').value = (item.catalysts || []).join(', ');
    
    if(item.broker_reports && item.broker_reports.length){
      document.getElementById('form-brokers').value = item.broker_reports.map(r => `${r.broker||''},${r.rating||''},${r.target_price||''}`).join(' ; ');
    } else {
      document.getElementById('form-brokers').value = '';
    }

    document.getElementById('form-note').value = item.last_report_note || '';
  }else{
    title.textContent = '+ 新增 Thesis 研報卡片';
    document.getElementById('form-code').readOnly = false;
  }

  overlay.classList.add('active');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
  editingCode = null;
}

function handleFormSubmit(e){
  e.preventDefault();
  const codeEl = document.getElementById('form-code');
  const nameEl = document.getElementById('form-name');
  let code = codeEl ? codeEl.value.trim().toUpperCase() : '';
  let name = nameEl ? nameEl.value.trim() : '';

  if(!code){
    alert('請輸入股票代號');
    return;
  }
  if(!name) name = code;

  const category = (document.getElementById('form-category').value || '').trim();
  const overallBias = document.getElementById('form-bias').value || 'bull';
  const epsLow = parseFloat(document.getElementById('form-eps-low').value);
  const epsHigh = parseFloat(document.getElementById('form-eps-high').value);
  const peLow = parseFloat(document.getElementById('form-pe-low').value);
  const peHigh = parseFloat(document.getElementById('form-pe-high').value);

  const bull = (document.getElementById('form-bull').value || '').trim();
  const base = (document.getElementById('form-base').value || '').trim();
  const bear = (document.getElementById('form-bear').value || '').trim();
  const rawCat = (document.getElementById('form-catalysts').value || '').trim();
  const catalysts = rawCat ? rawCat.split(/[,，]/).map(s => s.trim()).filter(Boolean) : [];
  
  const rawBrokers = (document.getElementById('form-brokers').value || '').trim();
  let brokerReports = [];
  if(rawBrokers){
    brokerReports = rawBrokers.split(';').map(part => {
      const segs = part.split(/[,，]/).map(s => s.trim());
      return {
        broker: segs[0] || '券商',
        rating: segs[1] || '評等',
        target_price: parseFloat(segs[2]) || null
      };
    }).filter(b => b.broker || b.target_price);
  }

  const note = (document.getElementById('form-note').value || '').trim();

  thesisData[code] = {
    stock_name: name,
    category: category || '自訂研報',
    overall_bias: overallBias,
    consensus_forecast: {
      "2026_eps_range": (!isNaN(epsLow) && !isNaN(epsHigh)) ? [epsLow, epsHigh] : [],
      "target_pe_range": (!isNaN(peLow) && !isNaN(peHigh)) ? [peLow, peHigh] : []
    },
    thesis_points: { bull, base, bear },
    catalysts: catalysts,
    broker_reports: brokerReports,
    last_report_note: note
  };

  saveLocalData();
  closeModal();
}

function editCard(code){
  openModal(code);
}

function deleteCard(code){
  if(confirm(`確定要刪除 ${code} ${thesisData[code]?.stock_name || ''} 的 Thesis 紀錄嗎？`)){
    delete thesisData[code];
    saveLocalData();
  }
}

function exportJSON(){
  const jsonStr = JSON.stringify(rawFullData, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'research_theses.json';
  a.click();
  URL.revokeObjectURL(url);
}
